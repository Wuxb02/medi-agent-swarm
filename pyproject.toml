[project]
name = "medix-agent-swarm"
version = "0.1.0"
description = "Multi-agent medical assistant system based on MediZJ-R1"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "MediZJ Team" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Healthcare Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "openai>=1.33.0,<2.0.0",
    "sentence-transformers==5.3.0",
    "torch>=2.0.0",
    "transformers>=4.41.0",
    "pydantic==2.10.0",
    "pydantic-settings==2.7.0",
    "pydantic-xml>=2.20.0",
    "mem0ai==0.1.0",
    "redis==5.2.0",
    "qdrant-client==1.12.0",
    "pymilvus[model]>=2.3.0",
    "requests==2.32.0",
    "beautifulsoup4==4.12.3",
    "duckduckgo-search==6.3.5",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "loguru==0.7.3",
    "python-dotenv==1.0.1",
    "pyyaml==6.0.3",
    "tqdm>=4.65.0",
    "aiohttp>=3.8.0",
    "httpx>=0.24.0",
    "milvus-lite>=2.5.1",
    "jieba>=0.42",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sse-starlette>=2.1.0",
    "python-multipart>=0.0.9",
    "jinja2>=3.1.6",
    "nltk>=3.9.1",
    "langgraph>=0.2.0",
    "langgraph-checkpoint>=0.2.0",
]

[tool.setuptools.packages.find]
include = ["mediZJ*", "mediZJ.*"]

[project.optional-dependencies]
test = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "pytest-cov>=6.0,<7.0",
    "pytest-mock>=3.14,<4.0",
]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "pytest-cov>=6.0,<7.0",
    "pytest-mock>=3.14,<4.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = ["-v", "--strict-markers", "--tb=short"]
markers = [
    "unit: 纯单元测试，无外部依赖",
    "integration: 需要外部服务 (LLM/Mem0/Milvus/网络)",
    "slow: 慢速测试 (真实 LLM 调用)",
]

[tool.coverage.run]
source = ["mediZJ"]
omit = [
    "*/__pycache__/*",
    "tests/*",
    "examples/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
