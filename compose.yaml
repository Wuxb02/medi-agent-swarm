services:
  mysql:
    image: mysql:8.4.4
    ports: ["127.0.0.1:3306:3306"]
    environment:
      MYSQL_DATABASE: medizj
      MYSQL_USER: medizj
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_bin"]
    volumes: ["mysql_data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  redis:
    image: redis:7.4.2
    ports: ["127.0.0.1:6379:6379"]
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    command: ["etcd", "--advertise-client-urls=http://etcd:2379", "--listen-client-urls=http://0.0.0.0:2379", "--data-dir=/etcd"]
    volumes: ["etcd_data:/etcd"]
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  minio:
    image: medizj-minio:2025-10-15
    build:
      context: .
      dockerfile: docker/minio.Dockerfile
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-medizj}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    command: ["server", "/data"]
    volumes: ["minio_data:/data"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  milvus:
    image: milvusdb/milvus:v2.5.10
    ports: ["127.0.0.1:19530:19530"]
    command: ["milvus", "run", "standalone"]
    security_opt: ["seccomp:unconfined"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-medizj}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    volumes: ["milvus_data:/var/lib/milvus"]
    depends_on:
      etcd: {condition: service_healthy}
      minio: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  migrate:
    env_file: .env
    build: .
    image: medizj-app:local
    environment: &app_environment
      MYSQL_URL: mysql+asyncmy://medizj:${MYSQL_PASSWORD}@mysql:3306/medizj
      REDIS_URL: redis://redis:6379/0
      MILVUS_URI: http://milvus:19530
      UPLOAD_DIR: /data/uploads
      APP_ENVIRONMENT: production
      EMBEDDING_MODEL_NAME: /opt/models/embedding
      HF_HUB_OFFLINE: "1"
    command: ["python", "-m", "mediZJ.infrastructure.bootstrap"]
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
      milvus: {condition: service_healthy}
    restart: "no"
  app:
    image: medizj-app:local
    build: .
    env_file: .env
    environment: *app_environment
    ports: ["${APP_PORT:-8000}:8000"]
    volumes: ["uploads:/data/uploads"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 5
    stop_grace_period: 35s
    restart: unless-stopped
volumes:
  mysql_data:
  redis_data:
  etcd_data:
  minio_data:
  milvus_data:
  uploads:
